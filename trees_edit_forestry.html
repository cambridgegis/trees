<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=7, IE=9, IE=10">
	<meta name="viewport" content="initial-scale=1, maximum-scale=1,user-scalable=no"/>
    <title>Tree Editing App - Forestry</title>
    <link rel="stylesheet" href="http://serverapi.arcgisonline.com/jsapi/arcgis/3.5/js/dojo/dijit/themes/nihilo/nihilo.css">
    <link rel="stylesheet" href="http://serverapi.arcgisonline.com/jsapi/arcgis/3.5/js/esri/css/esri.css">
    <style>
      html, body, #map {
        height:100%;
        width:100%;
        margin:0;
        padding:0;
      }
      body {
        background-color:#FFF;
        overflow:hidden;
        font-family:"Trebuchet MS";
      }

	  #templatePickerDiv {
	    position: fixed;
	    z-index: 5;
	    top: 10px;
	    right: 10px;
	    border: 2px solid #666666;
	    border-radius: 5px;
	    padding: 0px;
	  }
	  
	  #locateImage {
	    position: fixed;
	    z-index: 5;
	    top: 90px;
	    left: 20px;
	    border: 2px solid #666666;
	    background-color: white;
	    width: 30px;
	    border-radius: 5px;
	  }
    </style>
	<script>var dojoConfig = { parseOnLoad: true };</script>
    <script src="http://serverapi.arcgisonline.com/jsapi/arcgis/3.5compact/"></script>
    <script src="js/trees_edit_forestry.js"></script>
  </head>

  <body class="nihilo">
	
    <div id="map">
	  <div id="templatePickerDiv"></div>
	  <img id="locateImage" onclick="initLocation();" src="http://gis.cambridgema.gov/images/icon-satellite.png" />
	</div>
	
  </body>
</html>
